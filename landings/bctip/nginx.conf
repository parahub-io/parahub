# bctip.org — successor notice for the retired printable-tips service.
# Hand-written: this is not a parahub.io feature landing, so landings/_generate.py
# does not know about it (no config.yaml in the directory, which is what it keys on).

server {
    listen 80;
    server_name bctip.org www.bctip.org;

    # Answer ACME on port 80. Without this the redirect below sends certbot to
    # HTTPS, which is exactly what a renewal is trying to repair.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://bctip.org$request_uri;
    }
}

# www → apex, so the old indexed www.bctip.org URLs land on the canonical page.
# The site was indexed under www (og:url said so), so this is most of the old traffic.
server {
    listen 443 ssl;
    server_name www.bctip.org;
    ssl_certificate /etc/letsencrypt/live/bctip.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bctip.org/privkey.pem;

    # An HTML verification token, if one is ever used instead of the DNS TXT
    # record, has to be served here too: Search Console fetches it from the exact
    # host it verifies and does not take this redirect for an answer.
    return 301 https://bctip.org$request_uri;
}

server {
    listen 443 ssl;
    server_name bctip.org;
    ssl_certificate /etc/letsencrypt/live/bctip.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bctip.org/privkey.pem;

    root /opt/parahub/landings/bctip/output;

    # Security headers. Keep add_header OUT of child locations: a location-level
    # add_header replaces ALL inherited ones (caching there uses `expires` instead).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No scripts at all on this page, and every image is served from here.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    expires 1h;

    location = / {
        try_files /index.html =404;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
    }

    location = /og.jpg {
        try_files /og.jpg =404;
        expires 7d;
    }

    location = /notes-2013.webp {
        try_files /notes-2013.webp =404;
        expires 7d;
    }

    location = /note-today.webp {
        try_files /note-today.webp =404;
        expires 7d;
    }

    # The 2013 originals, byte for byte. Named explicitly like every other asset:
    # the catch-all below would otherwise 301 them to the notice.
    location = /bctip-logo.png {
        try_files /bctip-logo.png =404;
        expires 7d;
    }

    location = /favicon.ico {
        try_files /favicon.ico =404;
        expires 7d;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Every old tip URL (/xxxx-xxxx-xxxx/) and every other path lands on the notice.
    location / {
        return 301 /;
    }
}
