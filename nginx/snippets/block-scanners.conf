# Vulnerability-scanner junk — drop it at the edge. Every such URL otherwise
# costs a full Vue SSR error-page render through the [...slug] catch-all.
# 444 closes the connection without spending bytes on a response.
#
# Included inside a server{} block, AFTER any legitimate regex locations
# (regex locations match in order of appearance) and before the SSR
# `location /`. Dotfiles (/.env, /.git) are already denied by the vhost's
# own `location ~ /\.` rule.

# Script extensions this stack never serves (Django + Nuxt: no PHP/ASP/JSP/CGI)
location ~* \.(php\d?|asp|aspx|jsp|cgi)(/|$) {
    return 444;
}

# Well-known scanner path prefixes
location ~* ^/(wp-admin|wp-content|wp-includes|wp-login|wordpress|xmlrpc|phpmyadmin|pma|cgi-bin|owncloud|remote/fgt_lang|vendor/phpunit|solr|actuator|HNAP1|boaform|SDK/webLanguage)(/|$|\.) {
    return 444;
}
