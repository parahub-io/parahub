# Standard reverse-proxy headers for HTTP-upstream locations.
# HTTP/1.1 + empty Connection enables upstream keepalive pools.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $server_name;
# Mesh bind trusts X-Ygg-* only when stamped by the ygg listener blocks (see
# snippets/ygg-gate.conf); blank them here so a client-sent copy never reaches
# the backend. Any new vhost proxying /api/ must scrub these three too.
proxy_set_header X-Ygg-Gate "";
proxy_set_header X-Ygg-Client-IP "";
proxy_set_header X-Ygg-Client-Port "";
# Upstreams advertise themselves (Nitro: "X-Powered-By: Nuxt") — strip it.
proxy_hide_header X-Powered-By;
