# Per-crawler rate limiting (http context: map + zone; vhosts apply
# `limit_req zone=bots ...` in their SSR locations).
#
# Key = crawler family name, so each vertical shares one bucket regardless of
# how many IPs its fleet uses (GPTBot alone did ~900k SSR hits on 2026-07-05,
# feeding the nitro cache OOM incident). An empty key is NOT rate-limited:
# regular browsers, Googlebot and bingbot stay unthrottled — those two are
# deliberately absent below (SEO-critical, and both honour crawl-delay hints
# from Search Console / Webmaster Tools instead).
map $http_user_agent $limited_bot {
    default                 "";
    ~*GPTBot                gptbot;
    ~*OAI-SearchBot         oai-searchbot;
    ~*ChatGPT-User          chatgpt-user;
    ~*ClaudeBot             claudebot;
    ~*Claude-Web            claude-web;
    ~*anthropic-ai          anthropic-ai;
    ~*PerplexityBot         perplexitybot;
    ~*Amazonbot             amazonbot;
    ~*Bytespider            bytespider;
    ~*PetalBot              petalbot;
    ~*SemrushBot            semrushbot;
    ~*AhrefsBot             ahrefsbot;
    ~*MJ12bot               mj12bot;
    ~*DotBot                dotbot;
    ~*DataForSeoBot         dataforseobot;
    ~*meta-externalagent    meta-externalagent;
    ~*facebookexternalhit   facebookexternalhit;
}

# 5 r/s per crawler family — enough for steady indexing (~430k pages/day),
# blocks stampedes. Excess gets 429 (crawlers understand it as backoff).
limit_req_zone $limited_bot zone=bots:1m rate=5r/s;
limit_req_status 429;
